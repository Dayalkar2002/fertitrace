<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="fertiRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="80%" stop-color="#6345A6" />
      <stop offset="100%" stop-color="#7A3DB8" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="dnaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6345A6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Background Circle for Contrast -->
  <circle cx="50" cy="50" r="48" fill="#ffffff" />

  <!-- Outer Circular Ring with Teal-to-Purple Gradient -->
  <circle cx="50" cy="50" r="44" stroke="url(#fertiRingGrad)" stroke-width="7" />

  <!-- Plant Sprout Leaf 1 -->
  <path d="M 52 38 C 50 24, 62 18, 66 18 C 66 18, 64 30, 52 38 Z" fill="url(#leafGrad)" />

  <!-- Plant Sprout Leaf 2 -->
  <path d="M 48 38 C 42 28, 30 26, 30 26 C 30 26, 40 34, 48 38 Z" fill="url(#leafGrad)" />

  <!-- Stem -->
  <path d="M 50 48 C 50 38, 52 30, 52 24" stroke="url(#leafGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Cell Node Circle -->
  <circle cx="50" cy="46" r="6" fill="#6345A6" />
  <circle cx="50" cy="46" r="2.5" fill="#ffffff" opacity="0.9" />

  <!-- DNA Strand 1 (Upper Curve) -->
  <path d="M 20 62 Q 35 48, 50 62 T 80 62" stroke="url(#dnaGrad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- DNA Strand 2 (Lower Curve) -->
  <path d="M 20 72 Q 35 84, 50 72 T 80 72" stroke="url(#dnaGrad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- DNA Rung Connectors -->
  <line x1="28" y1="58" x2="28" y2="76" stroke="#8b5cf6" stroke-width="3" />
  <line x1="38" y1="54" x2="38" y2="80" stroke="#6345A6" stroke-width="3" />
  <line x1="50" y1="62" x2="50" y2="72" stroke="#2563eb" stroke-width="3" />
  <line x1="62" y1="54" x2="62" y2="80" stroke="#6345A6" stroke-width="3" />
  <line x1="72" y1="58" x2="72" y2="76" stroke="#8b5cf6" stroke-width="3" />
</svg>
